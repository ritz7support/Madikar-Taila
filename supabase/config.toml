# Meta and Razorpay call these directly and cannot send a Supabase JWT,
# so each of these functions must verify the caller's signature itself.
[functions.whatsapp-webhook]
verify_jwt = false

[functions.whatsapp-flow]
verify_jwt = false

[functions.razorpay-webhook]
verify_jwt = false

[functions.sync-meta-catalog]
verify_jwt = true

# Retired compatibility endpoint: returns 410 and never sends handoffs.
[functions.retry-order-handoffs]
verify_jwt = false

# The Sites Worker authenticates to this website-only function with a signed request.
[functions.madikar-store]
verify_jwt = false
